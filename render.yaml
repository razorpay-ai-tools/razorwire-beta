services:
  - type: web
    name: razorwire-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: WEB_ORIGIN
        value: https://razorwire.aisites.razorpay.com
      - key: DEV_AUTH_EMAIL
        value: aisites@razorpay.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://bkizgcbhtdglxutwhvcl.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: razorwire-videos
      - key: SUPABASE_STORAGE_PUBLIC
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "52428800"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
