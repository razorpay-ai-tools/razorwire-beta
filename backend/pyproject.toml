[project]
name = "razorwire-api"
version = "0.1.0"
description = "Razorwire backend — feed, posts, reactions, and the storyboard generation pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "eval_type_backport>=0.4",
    "python-multipart>=0.0.17",
    "google-auth>=2.36",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
